name: CI Badge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ci-badge
  cancel-in-progress: true

jobs:
  update:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Select badge
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$CONCLUSION" = "success" ]; then
            badge=ci-passing.svg
          else
            badge=ci-failing.svg
          fi
          cp ".github/badges/$badge" .github/badges/ci.svg

      - name: Commit badge
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$HEAD_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "Skipping: master has moved past this CI run."
            git checkout -- .github/badges/ci.svg
            exit 0
          fi

          if git diff --quiet -- .github/badges/ci.svg; then
            echo "CI badge is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/ci.svg
          git commit -m "Update CI badge"
          git push
