name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/badges/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / MSVC Release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "Visual C++ tools not found" }

          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                [Environment]::SetEnvironmentVariable($matches[1], $matches[2])
              }
            }

          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "cl.exe not on PATH after vcvars64.bat"
          }

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset Release

      - name: Test
        run: ctest --preset Release --output-on-failure --timeout 60

  linux:
    name: Linux / GCC Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libwayland-dev libwayland-egl-backend-dev

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset Release

      - name: Test
        run: ctest --preset Release --output-on-failure --timeout 60

  linux-debug:
    name: Linux / GCC Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libwayland-dev libwayland-egl-backend-dev

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset Debug

      - name: Test
        run: ctest --preset Debug --output-on-failure --timeout 60

  linux-no-bgfx:
    name: Linux / GCC No bgfx
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset release -DWGFX_WITH_BGFX=OFF

      - name: Build
        run: cmake --build --preset Release

      - name: Test
        run: ctest --preset Release --output-on-failure --timeout 60

  macos:
    name: macOS / AppleClang Release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Ensure Ninja
        run: command -v ninja || brew install ninja

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset Release

      - name: Test
        run: ctest --preset Release --output-on-failure --timeout 60
